name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chat/database build
      - run: pnpm --filter @chat/types build
      - run: pnpm --filter @chat/utils build
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run format
      - run: pnpm -r --if-present run test
